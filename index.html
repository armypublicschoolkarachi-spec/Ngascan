<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101318">
  <meta name="description" content="Sun Scan — browse series and read the latest chapter updates.">
  <title>Sun Scan</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#" data-action="home" aria-label="Sun Scan home">SUN <span>SCAN</span></a>
    <button class="mobile-menu" id="mobile-menu" aria-label="Toggle menu">☰</button>
    <nav class="main-nav" aria-label="Main navigation">
      <button class="nav-link active" data-action="home">Home</button>
      <button class="nav-link" data-action="browse">Series</button>
      <button class="nav-link" data-action="latest">Latest</button>
      <button class="nav-link" data-action="saved">Bookmarks <span id="saved-count" class="tiny-count">0</span></button>
    </nav>
    <label class="header-search"><span aria-hidden="true">⌕</span><input id="search-input" type="search" placeholder="Search series..." autocomplete="off" aria-label="Search series"></label>
  </header>

  <main id="app" class="shell" tabindex="-1">
    <section class="page-intro">
      <h1>Latest Updates</h1>
      <p>Read the latest chapters and find your next series.</p>
    </section>

    <section class="updates-section" id="latest-section">
      <div class="release-list" id="release-list"></div>
    </section>

    <section class="library-section" id="library-section">
      <div class="section-heading">
        <h2 id="library-title">Browse Series</h2>
        <div class="library-controls">
          <select id="genre-select" aria-label="Filter by genre"><option value="All">All genres</option></select>
          <select id="sort-select" aria-label="Sort series"><option value="featured">Featured</option><option value="title">Title A–Z</option><option value="updated">Recently updated</option></select>
        </div>
      </div>
      <div class="series-grid" id="series-grid"></div>
      <div id="empty-state" class="empty-state" hidden><h3>No series found</h3><p>Try another title or genre.</p><button class="btn btn-ghost" data-action="browse">Clear filters</button></div>
    </section>
    <div id="featured-grid" hidden></div>
    <span id="stat-series" hidden>0</span>
    <div id="genre-chips" hidden></div>
  </main>

  <footer class="site-footer shell"><a class="brand footer-brand" href="#" data-action="home">SUN <span>SCAN</span></a><p>Independent scanlation archive.</p><span class="footer-meta">SUN SCAN © <span id="year"></span></span></footer>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" id="modal-close" aria-label="Close">×</button>
      <div id="modal-content"></div>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
